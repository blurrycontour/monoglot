services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build: ./worker
    restart: unless-stopped
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL}
      WHISPER_DEVICE: ${WHISPER_DEVICE}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE}
      WHISPER_BEAM_SIZE: ${WHISPER_BEAM_SIZE}
      WHISPER_IDLE_UNLOAD_SECONDS: ${WHISPER_IDLE_UNLOAD_SECONDS:-600}
    volumes:
      # The worker reads audio by path, so it must see the same files the API
      # wrote. Read-only: the worker never modifies content.
      - ./data:/data:ro
      - models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      API_PORT: "8080"
      AUTH_TOKEN: ${AUTH_TOKEN}
      AUDIO_DIR: /data/audio
      RAW_DIR: /data/raw
      DATA_CACHE_DIR: /data/cache
      APK_PATH: /data/apk/monoglot.apk
      WORKER_URL: http://worker:9000
      INGEST_CRON_HOUR: ${INGEST_CRON_HOUR}
      INGEST_CRON_MINUTE: ${INGEST_CRON_MINUTE}
      INGEST_ON_START: ${INGEST_ON_START}
      LLM_ENABLED: ${LLM_ENABLED}
      OLLAMA_URL: ${OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      TZ: Europe/Stockholm
    volumes:
      - ./data:/data
    ports:
      # Bound to all interfaces so the phone on the LAN can reach it.
      # This service must not be exposed to the public internet.
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  models:
