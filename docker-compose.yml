# One file for both machines.
#
#   development   docker compose up -d --build      builds from this checkout
#   production    docker compose pull && up -d      runs the published images
#
# A production host needs only this file and a .env: the API imports the
# dictionary and word forms itself on first start, so there is nothing else to
# run. `build:` is harmless there because `pull` has already fetched the image
# and compose will not rebuild what it has.
#
# ./data is a bind mount on both, deliberately: the database, audio and the APK
# are things you want to be able to see, back up and copy with ordinary tools.
#
# .env is the single list of settings: it is handed to both services whole
# rather than restated as an `environment:` block, which had drifted into a
# second set of defaults disagreeing with the first. Compose also reads it
# itself for the two `${...}` below — those are the only values it needs before
# a container exists.
services:
  worker:
    image: ${IMAGE_REGISTRY:-ghcr.io/blurrycontour}/monoglot-worker:${IMAGE_TAG:-latest}
    build: ./worker
    restart: unless-stopped
    env_file: .env
    volumes:
      # The worker reads audio by path, so it must see the same files the API
      # wrote. Read-only: the worker never modifies content.
      - ${DATA_DIR:-./data}:/data:ro
      - models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    image: ${IMAGE_REGISTRY:-ghcr.io/blurrycontour}/monoglot-api:${IMAGE_TAG:-latest}
    build: ./api
    restart: unless-stopped
    env_file: .env
    volumes:
      - ${DATA_DIR:-./data}:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${API_PORT:-8080}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 10

volumes:
  # Only the Whisper weights: a few hundred MB that nothing outside the worker
  # ever needs to look at.
  models:
