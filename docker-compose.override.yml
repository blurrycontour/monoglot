# Development overrides, merged automatically by `docker compose` when this
# file sits beside docker-compose.yml.
#
# Two differences from production, both deliberate:
#   - images are built from this checkout rather than pulled from GHCR
#   - /data is a bind mount to ./data, so the database, audio and the APK the
#     install page serves are all visible and editable on the host
#
# A production host has neither this file nor the repo, so it gets the
# published image and a named volume instead.
services:
  worker:
    build: ./worker
    volumes:
      - ./data:/data:ro

  api:
    build: ./api
    volumes:
      - ./data:/data
