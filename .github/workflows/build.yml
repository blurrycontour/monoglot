name: build

# Two jobs: publish the container images that the production host pulls, and
# build the APK as a downloadable artifact. No tags and no release pipeline —
# main is the only branch that publishes, and :latest is what prod runs.
#
# It also serves as the clean-checkout compile check, which is not theoretical:
# an unanchored data/ in .gitignore once swallowed a whole Kotlin package.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
    outputs:
      # Whether the build is release-signed, which decides whether the api
      # image is allowed to ship it. A debug APK carries a throwaway key and
      # could never update the app on a phone, so baking one in would publish
      # an install that quietly dead-ends.
      signed: ${{ steps.task.outputs.signed }}
    # Secrets are lifted to job env because the `secrets` context is not
    # available in a step-level `if`; `env` is.
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # The signing key is what makes an in-place update possible: Android
      # identifies an app by (applicationId, signing key). Without the secrets
      # this job still builds, but produces a debug APK that can only ever be
      # installed fresh.
      - name: Restore signing key
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/release.keystore android/keystore.properties

      # The toolchain image is tagged by a hash of its own Dockerfile, so it is
      # built once and pulled on every later run. Login is needed to pull it as
      # well as to push: GHCR packages are private by default.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Owner in lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # Gradle's home is the rest of the APK build time: ~420MB of dependencies
      # and ~1.2GB of transformed artifacts that a fresh runner would otherwise
      # download and re-derive every run. The toolchain image only ever covered
      # the SDK and Gradle itself.
      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: .gradle-cache
          key: gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Choose task
        id: task
        run: |
          if [ -f android/release.keystore ]; then
            echo "TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      # Same container the local build uses, so CI cannot pass on a toolchain
      # the host does not have. There is no Gradle wrapper in the tree by
      # design; the image supplies Gradle and the SDK. versionCode comes from
      # the clock, so a later local build always outranks a CI one.
      - name: Build APK
        env:
          GRADLE_CACHE_DIR: ${{ github.workspace }}/.gradle-cache
          ANDROID_BUILD_REGISTRY: ghcr.io/${{ env.OWNER }}
          # Publish a newly built toolchain only from main. A pull request that
          # changes Dockerfile.build still builds it, and still gets a working
          # APK, it just does not claim the tag before the change is merged.
          ANDROID_BUILD_PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '1' || '0' }}
        run: scripts/android.sh "$TASK"

      # data/apk holds the published pair: the APK and the version.json the
      # in-app updater reads. Only release tasks write it.
      - uses: actions/upload-artifact@v7
        if: steps.task.outputs.signed == 'true'
        with:
          name: monoglot-apk
          path: data/apk/
          retention-days: 14
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: steps.task.outputs.signed != 'true'
        with:
          name: monoglot-apk-debug
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error

  images:
    runs-on: ubuntu-latest
    needs: apk
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      # GOWORK=off matches the local rule: a parent go.work otherwise captures
      # this module. Harmless here, kept so CI and a laptop run the same thing.
      - name: Test
        working-directory: api
        env:
          GOWORK: "off"
        run: go test ./...

      # The app rides along in the api image so a production host, which
      # builds nothing itself, can still serve /download.
      - name: Collect the signed APK
        if: needs.apk.outputs.signed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: monoglot-apk
          path: api/apk/

      - uses: docker/setup-buildx-action@v4

      # Pull requests build but must not publish: :latest is what the
      # production host runs, and it is not a review surface.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Owner in lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: ./api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/monoglot-api:latest
            ghcr.io/${{ env.OWNER }}/monoglot-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push worker
        uses: docker/build-push-action@v7
        with:
          context: ./worker
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/monoglot-worker:latest
            ghcr.io/${{ env.OWNER }}/monoglot-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
