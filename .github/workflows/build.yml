name: build

# Two jobs: publish the container images that the production host pulls, and
# build the APK as a downloadable artifact. No tags and no release pipeline —
# main is the only branch that publishes, and :latest is what prod runs.
#
# It also serves as the clean-checkout compile check, which is not theoretical:
# an unanchored data/ in .gitignore once swallowed a whole Kotlin package.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      # GOWORK=off matches the local rule: a parent go.work otherwise captures
      # this module. Harmless here, kept so CI and a laptop run the same thing.
      - name: Test
        working-directory: api
        env:
          GOWORK: "off"
        run: go test ./...

      - uses: docker/setup-buildx-action@v3

      # Pull requests build but must not publish: :latest is what the
      # production host runs, and it is not a review surface.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Owner in lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/monoglot-api:latest
            ghcr.io/${{ env.OWNER }}/monoglot-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ env.OWNER }}/monoglot-worker:latest
            ghcr.io/${{ env.OWNER }}/monoglot-worker:${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

  apk:
    runs-on: ubuntu-latest
    # Secrets are lifted to job env because the `secrets` context is not
    # available in a step-level `if`; `env` is.
    env:
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      # The signing key is what makes an in-place update possible: Android
      # identifies an app by (applicationId, signing key). Without the secrets
      # this job still builds, but produces a debug APK that can only be
      # installed fresh — it can never update the app on your phone.
      - name: Restore signing key
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/release.keystore android/keystore.properties
          echo "TASK=assembleRelease" >> "$GITHUB_ENV"

      - name: Choose task
        run: echo "TASK=${TASK:-assembleDebug}" >> "$GITHUB_ENV"

      # Same container the local build uses, so CI cannot pass on a toolchain
      # the host does not have. There is no Gradle wrapper in the tree by
      # design; the image supplies Gradle and the SDK.
      - name: Build APK
        run: scripts/android.sh "$TASK"

      - uses: actions/upload-artifact@v4
        with:
          name: monoglot-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 14
          if-no-files-found: error
